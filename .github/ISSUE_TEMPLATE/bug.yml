name: Bug report
description: Something broken or unexpected on Mac ↔ Mac LAN sharing
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in what you can—partial info is fine for an early spike.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Short description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: input
    id: macos
    attributes:
      label: macOS version(s)
      placeholder: e.g. 15.x on both Macs
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste text logs if you have them. Avoid secrets.
    validations:
      required: false
